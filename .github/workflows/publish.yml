name: publish

# Ordinary publication of explicitly configured build targets after main CI.
# No release-approval variable, license selector or content scanner.
on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: bph
          skipPush: true
      - name: Build configured targets
        run: |
          system=$(nix config show system)
          case "$RUNNER_ARCH" in
            X64) test "$(uname -m)" = x86_64; test "$system" = x86_64-linux ;;
            ARM64) test "$(uname -m)" = aarch64; test "$system" = aarch64-linux ;;
            *) exit 1 ;;
          esac
          # A failed evaluation must fail the job, not look like an empty list.
          names=$(nix eval --json ".#legacyPackages.$system.publicPushSet" --apply builtins.attrNames)
          list=$(jq -r '.[]' <<<"$names")
          mapfile -t boards <<<"$list"
          [ -n "$list" ] || boards=()
          if [ "${#boards[@]}" -eq 0 ]; then
            echo "No boards publish on $system."
            exit 0
          fi
          for board in "${boards[@]}"; do
            nix build -L ".#legacyPackages.$system.publicPushSet.$board" --out-link "push-set-$board" --builders '' --option extra-platforms ''
          done
      - name: Push to bph.cachix.org
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          shopt -s nullglob
          sets=(push-set-*)
          [ "${#sets[@]}" -gt 0 ] || exit 0
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "::warning::CACHIX_AUTH_TOKEN is not set; skipping the push."
            exit 0
          fi
          for set in "${sets[@]}"; do
            readlink -f "$set"
          done | cachix push bph
