name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flake-check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      # Read-only: substitute what the publish workflow pushed.
      - uses: cachix/cachix-action@v16
        with:
          name: bph
          skipPush: true
      - name: nix flake check
        run: nix flake check -L
